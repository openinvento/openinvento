name: License Compliance Check & Auto-Commit

on:
  push:
    branches: [ main ]

permissions:
  contents: write
jobs:
  license-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: ${{ github.head_ref || github.ref }}

    # --- 1. PYTHON BACKEND ---
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ./backend/.

    - name: Run Python Forbidden License Check
      working-directory: ./backend
      run: python scripts/manage_licenses.py --check

    - name: Generate Python License File
      working-directory: ./backend
      run: python scripts/manage_licenses.py


    # --- 2. NODE.JS FRONTEND ---
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'pnpm'
        cache-dependency-path: frontend/pnpm-lock.yaml

    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: pnpm ci

    - name: Run Frontend Forbidden License Check
      working-directory: ./frontend
      run: pnpm run license:check

    - name: Generate Frontend License File
      working-directory: ./frontend
      run: pnpm run license:generate


    # --- 3. AUTO-COMMIT CHANGES BACK TO REPOSITORY ---
    - name: Commit and Push Updated License Files
      if: github.event_name == 'push'
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Prüfen, ob sich überhaupt etwas geändert hat
        if [ -n "$(git status --porcelain backend/THIRD-PARTY-NOTICES-PYTHON.txt frontend/THIRD_PARTY_LICENSES.md)" ]; then
          echo "📝 License files changed. Committing updates..."
          git add backend/THIRD-PARTY-NOTICES-PYTHON.txt frontend/THIRD_PARTY_LICENSES.md
          git commit -m "chore: automatically update third-party license notices [skip ci]"
          git push
        else
          echo "✅ License files are already up to date. Nothing to commit."
        fi
