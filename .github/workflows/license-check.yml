name: License Compliance Check (Frontend & Backend)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  license-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ./backend.

    - name: Run Python Forbidden License Check
      working-directory: ./backend
      run: python manage_licenses.py --check

    - name: Verify THIRD-PARTY-NOTICES-PYTHON.txt is up to date
      run: |
        cd backend
        python manage_licenses.py
        cd ..
        if [ -n "$(git status --porcelain backend/THIRD-PARTY-NOTICES-PYTHON.txt)" ]; then
          echo "❌ ERROR: backend/THIRD-PARTY-NOTICES-PYTHON.txt is out of date!"
          echo "Please run 'python manage_licenses.py' inside the backend/ folder locally and commit the changes."
          exit 1
        fi
        echo "✅ Python license file is up to date!"


    # --- 2. NODE.JS FRONTEND SETUP & CHECKS ---
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: pnpm ci

    - name: Run Frontend Forbidden License Check
      working-directory: ./frontend
      run: pnpm run license:check

    - name: Verify frontend/THIRD_PARTY_LICENSES.md is up to date
      run: |
        cd frontend
        pnpm run license:generate
        cd ..
        if [ -n "$(git status --porcelain frontend/THIRD_PARTY_LICENSES.md)" ]; then
          echo "❌ ERROR: frontend/THIRD_PARTY_LICENSES.md is out of date!"
          echo "Please run 'pnpm run license:generate' inside the frontend/ folder locally and commit the changes."
          exit 1
        fi
        echo "✅ Frontend license markdown file is up to date!"
