name: CLA Check

on:
  issue_comment:
    types: [created]

  pull_request_target:
    types:
      - opened
      - closed
      - reopened
      - synchronize

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest

    steps:
      - name: CLA Assistant
        if: >
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the OpenInvento Contributor License Agreement, and I hereby sign the CLA'

        uses: openinvento/cla-github-action@786020d9a25a88bcbf0cf12dc6b260e61d736355

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_BOT }}

        with:
          path-to-signatures: 'signatures/v1/cla.json'

          path-to-document: 'https://github.com/openinvento/openinvento/blob/main/CLA/CLA_v1.md'

          branch: 'main'

          remote-organization-name: 'openinvento'
          remote-repository-name: 'openinvento-cla'

          require-opener-as-author: true

          lock-pullrequest-aftermerge: true

          suggest-recheck: true