name: CLA Check

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

jobs:
  cla-check:
    runs-on: ubuntu-latest

    steps:
      - name: CLA check
        if: (github.event.comment.body == 'recheck') || github.event_name == 'pull_request_target'
        uses: openinvento/cla-bot@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_BOT }}
        with:
          path-to-signatures: 'cla-bot/v1/cla.json'
          path-to-document: 'https://github.com/openinvento/openinvento/blob/main/CLA/CLA.md'
          branch: 'main'
          remote-organization-name: 'openinvento'
          remote-repository-name: 'openinvento-cla'
          custom-pr-sign-comment: 'I have read the OpenInvento Contributor License Agreement and I hereby agree to it.'