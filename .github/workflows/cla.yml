name: CLA Check

on:
  issue_comment:
    types: [created]

  pull_request_target:
    types:
      - opened
      - closed
      - reopened
      - synchronize

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest

    steps:
      - name: CLA Assistant
        if: >
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'I have read and understood the Contributor License Agreement, and I hereby agree to its terms.' ||
          (
            github.event.comment.body == 'recheck' &&
            (
              github.event.comment.author_association == 'OWNER' ||
              github.event.comment.author_association == 'MEMBER' ||
              github.event.comment.author_association == 'COLLABORATOR'
            )
          )

        uses: openinvento/cla-github-action@120ddac3df1ac95308f830024c7e7a3a7e293cc1 # Commit pinned version

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_BOT }}

        with:
          path-to-signatures: 'signatures/v1/cla.json'

          path-to-document: 'https://github.com/openinvento/openinvento/blob/main/CLA/CLA_v1.md'

          branch: 'main'

          remote-organization-name: 'openinvento'
          remote-repository-name: 'openinvento-cla'

          custom-notsigned-prcomment: 'Thank you for your contribution! Like many software projects that accept external contributions, this project requires contributors to accept a Contributor License Agreement (CLA).<br/><br/>Please read our [Contributor License Agreement]($pathToCLADocument) and accept it by posting the exact acceptance comment shown below.<br/><br/>This is a standard part of the contribution process and is required before your pull request can be merged. Thank you!'
          custom-pr-sign-comment: 'I have read and understood the Contributor License Agreement, and I hereby agree to its terms.'
          custom-allsigned-prcomment: 'All contributors have signed the [Contributor License Agreement]($pathToCLADocument) ✅.'

          require-opener-as-author: true

          lock-pullrequest-aftermerge: true

          suggest-recheck: true