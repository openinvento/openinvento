services:
  openinvento:
    image: ghcr.io/openinvento/openinvento:${OPENINVENTO_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${PORT-8080}:80"
    environment:
      DATA_DIRECTORY: /data
      APP_URL: ${APP_URL} # Public origin (e.g. example.com or https://example.com:8443) -> Include the scheme (http/s) and a port if you are not using the default ports (80 and 443)
      #APP_URLS: ${APP_URLS} # Optional comma-separated origins, same format as APP_URL - Use only APP_URL OR APP_URLS, not both
      INIT_ADMIN_USERNAME: ${INIT_ADMIN_USERNAME} # Initial administrator username; required when CREATE_INIT_ADMIN is true
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD} # Initial administrator password; change it on first login
      CREATE_INIT_ADMIN: ${CREATE_INIT_ADMIN:-true} # Set to false to disable initial administrator creation
      ENABLE_SIGNUP: ${ENABLE_SIGNUP:-false} # Set to true to enable public account signup
      SECRET_KEY: ${SECRET_KEY} # Set this to a random string for security purposes - You can generate one with `openssl rand -hex 32`
      # Single sign-on via OpenID Connect (optional). Needs APP_URL (with APP_URLS only, the first entry counts); register ${APP_URL}/api/oidc/callback/ as redirect URI at your provider. SSO logins started on another APP_URLS host move to this host first, so users stay logged in there.
      #OIDC_ENABLED: ${OIDC_ENABLED:-false} # Set to true to show the single sign-on button on the login page
      #OIDC_ISSUER: ${OIDC_ISSUER} # Issuer URL of your provider (e.g. https://id.example.com) - endpoints are discovered from it
      #OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      #OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET} # Leave empty for public clients (PKCE only)
      #OIDC_BUTTON_LABEL: ${OIDC_BUTTON_LABEL} # Provider name on the login button (e.g. Pocket ID)
      #OIDC_AUTO_REDIRECT: ${OIDC_AUTO_REDIRECT:-false} # Skip the login page and go straight to the provider (/auth/login?local=1 still shows it)
      #OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI} # Full redirect URI registered at your provider, if it is not ${APP_URL}/api/oidc/callback/
      #OIDC_CA_BUNDLE: /certs/ca.pem # CA certificate (PEM) for a provider with a private or self-signed certificate; mount it below
      #OIDC_SKIP_SSL_VERIFICATION: ${OIDC_SKIP_SSL_VERIFICATION:-false} # Insecure: no certificate check for the provider, anyone on the network path can log in as any user; prefer OIDC_CA_BUNDLE
      # Groups from the provider (optional, applied on every SSO login). Some providers only send groups with an extra scope, e.g. OIDC_SCOPES: "openid profile email groups" for Pocket ID.
      #OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-groups} # Claim that lists the user's groups
      #OIDC_GROUP_SYNC: ${OIDC_GROUP_SYNC:-false} # Set to true to sync inventory members from the groups below; members of these inventories are then managed by the provider only
      #OIDC_INVENTORY_GROUP_PREFIX: ${OIDC_INVENTORY_GROUP_PREFIX} # Every group with this prefix gets its own inventory (e.g. openinvento- turns openinvento-workshop into "workshop")
      #OIDC_GROUP_INVENTORIES: ${OIDC_GROUP_INVENTORIES} # JSON mapping of groups to existing inventories, e.g. {"family": "<inventory ID from the inventory settings>"}
      #OIDC_ALLOWED_GROUPS: ${OIDC_ALLOWED_GROUPS} # Comma-separated; only members of one of these groups can log in via SSO (works without OIDC_GROUP_SYNC)
      #OIDC_ADMIN_GROUP: ${OIDC_ADMIN_GROUP} # Members become instance administrators, non-members lose admin access (works without OIDC_GROUP_SYNC)
      #DISABLE_LOCAL_LOGIN: ${DISABLE_LOCAL_LOGIN:-false} # Disable password login and signup for everyone except LOCAL_LOGIN_USERS
      #LOCAL_LOGIN_USERS: ${LOCAL_LOGIN_USERS} # Comma-separated break-glass usernames that keep password login (default: INIT_ADMIN_USERNAME); they sign in at /auth/login?local=1
    volumes:
      - openinvento-data:/data
      #- ./ca.pem:/certs/ca.pem:ro # CA certificate for OIDC_CA_BUNDLE

volumes:
  openinvento-data:
