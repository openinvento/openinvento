services:
  openinvento:
    image: ghcr.io/openinvento/openinvento:${OPENINVENTO_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${PORT-8080}:80"
    environment:
      DATA_DIRECTORY: /data
      APP_URL: ${APP_URL} # Public origin (e.g. example.com or https://example.com:8443) -> Include the scheme (http/s) and a port if you are not using the default ports (80 and 443)
      #APP_URLS: ${APP_URLS} # Optional comma-separated origins, same format as APP_URL - Use only APP_URL OR APP_URLS, not both
      INIT_ADMIN_USERNAME: ${INIT_ADMIN_USERNAME} # Initial administrator username; required when CREATE_INIT_ADMIN is true
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD} # Initial administrator password; change it on first login
      CREATE_INIT_ADMIN: ${CREATE_INIT_ADMIN:-true} # Set to false to disable initial administrator creation
      ENABLE_SIGNUP: ${ENABLE_SIGNUP:-false} # Set to true to enable public account signup
      SECRET_KEY: ${SECRET_KEY} # Set this to a random string for security purposes - You can generate one with `openssl rand -hex 32`
      # Single sign-on via OpenID Connect (optional). Needs APP_URL; register ${APP_URL}/api/oidc/callback/ as redirect URI at your provider.
      #OIDC_ENABLED: ${OIDC_ENABLED:-false} # Set to true to show the single sign-on button on the login page
      #OIDC_ISSUER: ${OIDC_ISSUER} # Issuer URL of your provider (e.g. https://id.example.com) - endpoints are discovered from it
      #OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      #OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET} # Leave empty for public clients (PKCE only)
      #OIDC_BUTTON_LABEL: ${OIDC_BUTTON_LABEL} # Provider name on the login button (e.g. Pocket ID)
      #OIDC_AUTO_REDIRECT: ${OIDC_AUTO_REDIRECT:-false} # Skip the login page and go straight to the provider (/auth/login?local=1 still shows it)
      #DISABLE_LOCAL_LOGIN: ${DISABLE_LOCAL_LOGIN:-false} # Disable password login and signup for everyone except LOCAL_LOGIN_USERS
      #LOCAL_LOGIN_USERS: ${LOCAL_LOGIN_USERS} # Comma-separated break-glass usernames that keep password login (default: INIT_ADMIN_USERNAME); they sign in at /auth/login?local=1
    volumes:
      - openinvento-data:/data

volumes:
  openinvento-data:
