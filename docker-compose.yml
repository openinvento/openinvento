services:
  openinvento:
    image: ghcr.io/openinvento/openinvento:${OPENINVENTO_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${PORT-8080}:80"
    environment:
      DATA_DIRECTORY: /data
      APP_URL: ${APP_URL} # Set this to the URL where the container will be accessible (e.g., http://localhost:80)
      INIT_ADMIN_USERNAME: ${INIT_ADMIN_USERNAME} # Initial administrator username; required when CREATE_INIT_ADMIN is true
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD} # Initial administrator password; change it on first login
      CREATE_INIT_ADMIN: ${CREATE_INIT_ADMIN:-true} # Set to false to disable initial administrator creation
      #APP_URLS: ${APP_URLS} # Optional: Set this to a comma-separated list of additional URLs (e.g., http://localhost:80,http://example.com)
      SECRET_KEY: ${SECRET_KEY} # Set this to a random string for security purposes
    volumes:
      - openinvento-data:/data

volumes:
  openinvento-data: